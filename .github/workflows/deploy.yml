name: QLF Formal Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-qlf:
    name: Machine-check QLF Null Cone
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nexus Quantum
        uses: actions/checkout@v4
        with:
          path: nexus-quantum

      - name: Checkout Quantum Logical Framework
        uses: actions/checkout@v4
        with:
          repository: jimscarver/quantum-logical-framework
          ref: main
          path: quantum-logical-framework

      - name: Install Lean
        working-directory: quantum-logical-framework
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -sSf | sh -s -- -y

          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show Lean version
        working-directory: quantum-logical-framework
        run: |
          lean --version
          lake --version

      - name: Build upstream QLF
        working-directory: quantum-logical-framework
        run: |
          lake build

      - name: Install Nexus Null Cone module
        run: |
          cp \
            nexus-quantum/backend/qlf_math/QLF_NullCone.lean \
            quantum-logical-framework/lean/QLF_NullCone.lean

      - name: Machine-check QLF_NullCone
        working-directory: quantum-logical-framework
        run: |
          lake env lean lean/QLF_NullCone.lean